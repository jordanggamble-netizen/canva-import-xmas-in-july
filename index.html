<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Incubator — Christmas in July</title>

<!-- Inter ≈ the sans used across the Canva design -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     TIKTOK BRAND BLOCK — official palette (Brand Guidelines 2025)
     Black colorway + the Glint/Blaze hero pairing. No gradients:
     the brand system forbids them, so surfaces are flat.
     ============================================================ */
  :root{
    --bg:        #000000;   /* Black — default brand background      */
    --card:      #FFFFFF;   /* White card                            */
    --card-ink:  #000000;   /* on-white text                         */
    --card-muted:#595959;   /* Grey — captions, muted text           */
    --blaze:     #F1204A;   /* Blaze — primary highlight, CTAs       */
    --glint:     #2DCCD3;   /* Glint — core cyan accent              */
    --line:      rgba(0,0,0,.12);  /* hairlines on the card          */
    --frost:     #2DCCD3;   /* snow specks pick up Glint             */

    --card-w: 460px;
    --radius: 22px;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    min-height:100dvh;
    background:var(--bg);
    color:#fff;
    font-family:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px;
    padding:40px 20px;
    overflow-x:hidden;
  }

  /* Ambient snow — Glint specks, very restrained.
     Fully removed for anyone who prefers reduced motion. */
  .frost-field{ position:fixed; inset:0; pointer-events:none; z-index:0; }
  .frost-field span{
    position:absolute; top:-10px; border-radius:50%;
    background:var(--frost); opacity:0;
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{ transform:translateY(-10px); opacity:0; }
    10%{ opacity:.5; }
    90%{ opacity:.35; }
    100%{ transform:translateY(102dvh); opacity:0; }
  }

  /* Everything above the snow, with a gentle entrance */
  .lockup,.pass,.brandline{
    position:relative; z-index:1;
    animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
  }

  /* Tiny strapline under the pass */
  .brandline{
    margin:0; text-align:center;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:#595959; font-weight:500;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---- TikTok Incubator lockup (official artwork) ---- */
  .lockup img{ display:block; height:84px; width:auto; max-width:90vw; object-fit:contain; }

  /* ============================================================
     THE EVENT PASS — white card on black
     ============================================================ */
  .pass{
    width:100%; max-width:var(--card-w);
    background:var(--card); color:var(--card-ink);
    border-radius:var(--radius);
    box-shadow:0 24px 60px -24px rgba(45,204,211,.35);
    overflow:hidden;
  }

  .pass__head{ padding:30px 26px 24px; }

  .presents{
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    font-weight:600; color:var(--card-ink); margin:0 0 14px;
  }
  .title{
    margin:0 0 4px;
    font-size:clamp(34px, 8vw, 46px); font-weight:800;
    letter-spacing:-.01em; color:var(--blaze);
    line-height:1.02;
  }
  .sub{
    font-size:15px; line-height:1.5; color:var(--card-muted);
    margin:14px 0 0; max-width:34ch;
  }

  .locations{
    display:flex; flex-direction:column; gap:3px;
    margin:22px 0 0; border-top:1px solid var(--line); padding-top:18px;
  }
  .locations .lab{
    margin:0;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    font-weight:600; color:var(--card-muted);
  }
  .locations .val{ margin:0; font-size:15px; font-weight:500; }

  /* ---- Perforation with punched side notches ---- */
  .perf{ position:relative; height:0; }
  .perf::before,.perf::after{
    content:""; position:absolute; top:-11px;
    width:22px; height:22px; border-radius:50%;
    background:var(--bg); /* matches page bg to read as punched holes */
  }
  .perf::before{ left:-11px; }
  .perf::after{ right:-11px; }
  .perf .dashes{
    position:absolute; left:16px; right:16px; top:-1px; height:2px;
    background:repeating-linear-gradient(90deg, var(--line) 0 7px, transparent 7px 15px);
  }

  /* ---- Deck + download ---- */
  .pass__foot{ padding:26px; }
  .deck{ display:flex; align-items:center; gap:14px; margin:0 0 20px; }
  .deck__icon{
    flex:none; width:46px; height:46px; border-radius:12px;
    background:#000000;
    display:flex; align-items:center; justify-content:center;
    color:#FFFFFF;
  }
  .deck__name{ font-weight:600; font-size:15px; }
  .deck__note{ font-size:13px; color:var(--card-muted); margin-top:2px; }

  /* The main action — Blaze is the brand's CTA color */
  .download{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:17px 20px;
    background:var(--blaze); color:#FFFFFF;
    font-weight:600; font-size:16px;
    text-decoration:none; border:none; border-radius:14px;
    cursor:pointer; letter-spacing:.01em;
    transition:transform .15s ease, opacity .15s ease;
    box-shadow:0 10px 24px -10px rgba(241,32,74,.6);
  }
  .download:hover{ transform:translateY(-2px); }
  .download:active{ transform:translateY(0); opacity:.9; }
  .download:focus-visible{ outline:3px solid var(--glint); outline-offset:3px; }
  .download svg{ flex:none; }

  @media (prefers-reduced-motion: reduce){
    .lockup,.pass{ animation:none; }
    .frost-field{ display:none; }
    .download{ transition:none; }
  }
</style>
</head>
<body>

<p class="brandline">Watch it. Love it. Want it.</p>

<script>
  // Generate a handful of frost specks. Skipped entirely if the user
  // prefers reduced motion, so nothing moves for them.
  (function(){
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var field = document.getElementById('frost');
    var N = 14;
    for (var i=0;i<N;i++){
      var s = document.createElement('span');
      var size = 2 + Math.random()*4;
      s.style.width = size+'px';
      s.style.height = size+'px';
      s.style.left = Math.random()*100+'%';
      s.style.animationDuration = (9 + Math.random()*9)+'s';
      s.style.animationDelay = (-Math.random()*12)+'s';
      field.appendChild(s);
    }
  })();
</script>
